name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q -x '/\.' .
      # Mocked suite: no database, Prefect server, Binance, Telegram or NVIDIA access needed.
      - run: python check.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked .env files and credential-shaped strings
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is tracked"; exit 1; fi
          pattern='nvapi-[A-Za-z0-9_-]{30,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed"; exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: market-data
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Offline: parsing, L2 sync, recorder and replay tests need no Binance access.
      - run: cargo test --locked
